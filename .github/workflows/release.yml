name: MeowPlayer - release

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:

  build-desktop:
    uses: ./.github/workflows/desktop.yml

  build-mobile:
    uses: ./.github/workflows/mobile.yml

  release:
    name: MeowPlayer release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release
          merge-multiple: true
        

      - name: Create release (by tag name)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release/*

      - name: Create release (by commit date)
        uses: softprops/action-gh-release@v2
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          tag_name: "nightly-${{ github.sha }}"
          name: ${{ github.event.head_commit.timestamp || github.sha }}
          prerelease: true
          files: release/*
  
