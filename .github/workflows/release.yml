name: MeowPlayer - release

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: write

jobs:
  build-desktop:
    uses: ./.github/workflows/desktop.yml

  build-mobile:
    uses: ./.github/workflows/mobile.yml

  release:
    name: MeowPlayer release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build-desktop, build-mobile]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release
          merge-multiple: true

      - name: Set Release Metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tag=build-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "title=Pre-release Build (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          files: release/*

