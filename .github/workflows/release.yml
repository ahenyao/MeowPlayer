name: MeowPlayer - release

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:

  build-desktop:
    uses: ./.github/workflows/desktop.yml

  build-mobile:
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  release:
    name: MeowPlayer release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile]
    if: github.event_name == 'push'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./release
          merge-multiple: true
        

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TITLE_NIGHTLY: ${{ github.event.head_commit.timestamp || github.sha }}
        shell: bash
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="$TAG"
            PRERELEASE=""
          else
            TAG="nightly-${{ github.sha }}"
            TITLE="${{ github.event.head_commit.timestamp || github.sha }}"
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" --repo "$GH_REPO" --title "$TITLE" $PRERELEASE
  
          for i in $(ls release/* | sort); do
            gh release upload "$TAG" "$i" --repo "$GH_REPO"
          done
