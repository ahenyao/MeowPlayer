name: MeowPlayer - release

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:

  build-desktop:
    uses: ./.github/workflows/desktop.yml

  build-mobile:
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  release:
    name: MeowPlayer release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./release
          merge-multiple: true
        

      - name: Create release (by tag name)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            release/*

      - name: Create release (by commit date)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "nightly-${{ github.sha }}" \
            --title "${{ github.event.head_commit.timestamp || github.sha }}" \
            --prerelease \
            release/*
  
